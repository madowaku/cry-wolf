  S03_CLUE:{phase:'night',scene:'clue',caption:'土の上に、ちいさな矛盾。',eyebrow:'NIGHT · 最初の1刻',lines:[['ベル','「でも、境界に足跡がある。\nどういうことだろう？」']],hint:'調査も合図も、ひとつ選ぶと1刻。',choices:'actions'},

function initial(){return {phase:'title',slideId:'S00_TITLE',ticks:2,actions:[],signal:'none',heard:false,notes:[],ending:null,score:null,report:null,help:false,modal:null};}
function withSlide(current,slideId){return {...current,slideId,phase:SLIDES[slideId]?.phase||'result'};}
function advanceSlide(current){
  if(current.modal)return current;
  const next=SLIDES[current.slideId]?.to;
  if(next)return withSlide(current,next);
  if(Object.values(OUTCOMES).some(o=>o.slideId===current.slideId))return withSlide(current,'S08_RECAP');
  return current;
}
function applyNightAction(current,action){
  if(current.modal||!ACTIONS.includes(action)||!['S03_CLUE','S05_DECISION'].includes(current.slideId)||current.ticks<1)return current;
  const second=current.ticks===1;
  return withSlide({...current,ticks:current.ticks-1,actions:[...current.actions,action],notes:[...current.notes,OBSERVATIONS[action][second?1:0]],heard:current.heard||action==='listen',signal:action==='signal'?(second?'held':'miss'):current.signal},second?'S04_OBSERVATION_2':'S04_OBSERVATION');
}
function resolveReport(current,report){
  if(current.modal||current.slideId!=='S06_REPORT'||current.ticks!==0||!REPORTS.includes(report)||current.ending)return current;
  const held=current.signal==='held';
  const ending=held?(report==='cry'?'false':'best'):(report==='cry'?'duty':'secret');
  const o=OUTCOMES[ending];
  return withSlide({...current,ending,report,score:{trust:o.trust,bond:o.bond}},o.slideId);
}

<script id="storybook-audio">
const MUSIC_TRACKS={
  opening:{title:'the fairy tale',author:'のる',role:'オープニング',page:'https://opentracks.com/bgm/detail/19133'},
  gameplay:{title:'Storyteller',author:'のる',role:'プレイ中',page:'https://opentracks.com/bgm/detail/21959'},
  ending:{title:'月夜',author:'チョコミント',role:'エンディング',page:'https://opentracks.com/bgm/detail/6987'}
};
const musicForPhase=phase=>phase==='title'||phase==='intro'?'opening':phase==='result'?'ending':'gameplay';
function createMusicController({createAudio,sourceFor,now,raf,caf,onChange=()=>{}}){
  const nodes=new Map();
  let target='opening',muted=true,suspended=false,volume=.22,status='muted',frame=0,generation=0,disposed=false;
  const notify=()=>onChange({target,muted,suspended,volume,status});
  function stopFade(){if(frame)caf(frame);frame=0;}
  function pauseAll(){stopFade();for(const audio of nodes.values()){audio.volume=0;audio.pause();}}
  function synchronize(){
    if(disposed)return;
    const token=++generation;
    stopFade();
    if(muted||suspended){pauseAll();status=muted?'muted':'paused';notify();return;}
    let src;
    try{src=sourceFor(target);}catch{pauseAll();status='error';notify();return;}
    if(!src){pauseAll();status='missing';notify();return;}
    let selected=nodes.get(target);
    if(!selected){try{selected=createAudio(src);selected.loop=true;selected.preload='auto';selected.volume=0;nodes.set(target,selected);}catch{pauseAll();status='error';notify();return;}}
    status=selected.paused?'loading':'playing';notify();
    if(selected.paused){
      try{Promise.resolve(selected.play()).then(()=>{
        if(disposed||muted||suspended||selected!==nodes.get(target)){selected.pause();return;}
        if(token===generation){status='playing';notify();}
      }).catch(error=>{if(!disposed&&token===generation){pauseAll();status=error?.name==='NotAllowedError'?'blocked':'error';notify();}});}
      catch(error){pauseAll();status=error?.name==='NotAllowedError'?'blocked':'error';notify();return;}
    }
    const started=now(),starts=new Map([...nodes].map(([key,audio])=>[key,audio.volume]));
    function fade(){
      if(disposed||token!==generation)return;
      const progress=Math.min(1,(now()-started)/450);
      for(const [key,audio] of nodes){const end=key===target?volume:0;audio.volume=starts.get(key)+(end-starts.get(key))*progress;}
      if(progress<1)frame=raf(fade);
      else{frame=0;for(const [key,audio] of nodes)if(key!==target){audio.pause();audio.currentTime=0;}}
    }
    frame=raf(fade);
  }
  return {
    setPhase(phase){const next=musicForPhase(phase);if(next!==target){target=next;synchronize();}},
    setMuted(value){muted=Boolean(value);synchronize();},
    setVolume(value){const n=Number(value);if(!Number.isFinite(n))return;volume=Math.max(0,Math.min(1,n));synchronize();},
    setSuspended(value){suspended=Boolean(value);synchronize();},
    refresh:synchronize,
    get(){return {target,muted,suspended,volume,status,loaded:[...nodes.keys()]};},
    dispose(){disposed=true;generation++;pauseAll();nodes.clear();}
  };
}
</script>

  if(state.modal==='audio')return `<div class="modal-layer"><section class="modal audio-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><h2 id="modal-title">月夜の音</h2>${choice('sound',muted?'音をオンにする':'音をオフにする','','secondary')}<p class="music-state" data-music-status role="status">${musicStatusText()}</p><div class="audio-controls"><label for="bgm-volume"><span>BGMの音量<output id="bgm-level" for="bgm-volume">${Math.round(music.get().volume*100)}%</output></span><input id="bgm-volume" data-volume="bgm" type="range" min="0" max="100" value="${Math.round(music.get().volume*100)}"></label><label for="se-volume"><span>効果音の音量<output id="se-level" for="se-volume">${Math.round(effectVolume*100)}%</output></span><input id="se-volume" data-volume="se" type="range" min="0" max="100" value="${Math.round(effectVolume*100)}"></label></div><ul class="music-credits">${Object.values(MUSIC_TRACKS).map(t=>`<li><span class="music-credit-role">${t.role}</span><a href="${t.page}" target="_blank" rel="noopener noreferrer">${t.title}</a> — ${t.author} / OpenTracks</li>`).join('')}</ul>${Object.keys(window.CRYWOLF_MUSIC_PACK?.tracks||{}).length<3?'<p class="music-state">指定の3曲は追加待ちです。効果音は使用できます。</p>':''}${choice('close','物語へ戻る','','primary')}</section></div>`;
  const notes=state.modal==='notes';
  return `<div class="modal-layer"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><h2 id="modal-title">${notes?'調査メモ':'見張りの決まり'}</h2>${notes?(state.notes.length?`<ol>${state.notes.map(n=>`<li>${escapeText(n)}</li>`).join('')}</ol>`:'<p class="empty">まだ調べたことはありません。</p>'):'<p>見張り道にオオカミが入ったら、鐘で村へ知らせます。森にいるだけなら、警報はいりません。</p><p>調査か合図をひとつ選ぶと1刻。2刻が終わると、必ず報告します。考える時間に制限はありません。</p><p>ランタンを二度隠すと「森側で待って」。遠い森には届かず、近い木陰には届きます。</p><p>メモ・ページ送り・この説明では、刻は進みません。</p>'}${choice('close','物語へ戻る','','primary')}</section></div>`;
}
function render(focusKey,enter=false){
  const data=slideData(),choicePage=Boolean(data.choices),recap=state.slideId==='S08_RECAP';
  const showTime=state.phase==='night'||state.phase==='report';
  const sequence=['S00_TITLE','S01_EVENING_A','S01_EVENING_B','S01_RULE','S02_NIGHT','S03_CLUE','S04_OBSERVATION','S05_DECISION','S04_OBSERVATION_2','S06_REPORT',state.ending?OUTCOMES[state.ending].slideId:null,'S08_RECAP'];
  const page=sequence.indexOf(state.slideId)+1;
  app.innerHTML=`<main class="book ${choicePage?'choice-page':''} ${recap?'recap-page':''}" data-phase="${state.phase}" data-slide="${state.slideId}" ${state.modal?'inert':''}><header class="hud"><div class="chapter">CRY WOLF!<b>${showTime ? "NIGHT 2 · 夜番" : "NIGHT 2 · 絵本のひと夜"}</b></div><div class="tools">${showTime?`<span class="time" aria-label="残り${state.ticks}刻">残り${state.ticks}刻<i class="${state.ticks>=1?'on':''}"></i><i class="${state.ticks>=2?'on':''}"></i></span><button class="icon" data-act="notes" aria-label="調査メモを開く">${icon('notes')}</button>`:''}<button class="icon" data-act="help" aria-label="遊び方を表示">?</button><button class="icon" data-act="sound" aria-label="${muted?'音をオンにする':'音をオフにする'}" aria-pressed="${!muted}">${icon(muted?'muted':'sound')}</button></div></header>${sceneMarkup(data,enter)}<section class="story ${enter?'page-enter':''}" aria-live="polite" aria-atomic="true"><p class="eyebrow">${data.eyebrow}</p>${recap?recapMarkup():`${data.heading?`<h2 class="heading">${data.heading}</h2>`:''}${copyMarkup(data)}${state.phase==='report'?reportEvidenceMarkup():''}${data.hint?`<p class="hint">${data.hint}</p>`:''}<div class="choices">${data.choices==='actions'?choice('track','足跡を調べる','土に残った痕跡を見る · 1刻')+choice('listen','耳を澄ます','声の方角と距離を聞く · 1刻')+choice('signal','ランタンで合図する','二度遮って「森側で待って」 · 1刻','signal'):data.choices==='reports'?choice('cry','鐘を鳴らす','見張り道への立ち入りを知らせる','cry')+choice('silent','異常なしと報告','見張り道には入っていない'):choice(state.slideId==='S00_TITLE'?'start':'next',data.next||'つぎへ','','primary')}</div>`}</section><footer class="footer"><span class="footer-brand">BELL & LUNA</span><button class="audio-settings" data-act="audio-settings" aria-label="音量設定を開く">♫ 音量</button><span aria-label="ページ ${page} / 12">${String(page).padStart(2,'0')} / 12</span></footer></main>${modalMarkup()}`;
  app.querySelector('.book').classList.toggle('report-page',state.phase==='report');
  if(state.modal){(app.querySelector(`.modal [data-act="${focusKey||'close'}"]`)||app.querySelector('[data-act="close"]')).focus({preventScroll:true});}
  else if(focusKey){(app.querySelector(`[data-act="${focusKey}"]`)||app.querySelector('.choices button'))?.focus({preventScroll:true});}
}
function act(key,{expectedSlide,guard=false}={}){
  if(expectedSlide&&state.slideId!==expectedSlide)return;
  if(key==='close'){
    if(!state.modal)return;
    state={...state,help:false,modal:null};render(focusReturn);return;
  }
  if(key==='sound'&&(!state.modal||state.modal==='audio')){muted=!muted;music.setMuted(muted);if(effectBus)effectBus.gain.setValueAtTime(muted?0:effectVolume,audio.currentTime);render('sound');return;}
  if(state.modal)return;
  if(key==='help'||key==='notes'||key==='audio-settings'){
    focusReturn=key;state={...state,modal:key==='audio-settings'?'audio':key,help:key==='help'};render();return;
  }
  if(guard&&performance.now()<inputLockedUntil)return;
  let updated=state;
  if(key==='start'&&state.slideId==='S00_TITLE')updated=withSlide(state,'S01_EVENING_A');
  else if(key==='next')updated=advanceSlide(state);
  else if(ACTIONS.includes(key))updated=applyNightAction(state,key);
  else if(REPORTS.includes(key))updated=resolveReport(state,key);
  else if(key==='restart'&&state.slideId==='S08_RECAP')updated=withSlide(initial(),'S01_EVENING_A');
  else if(key==='title'&&state.slideId==='S08_RECAP')updated=initial();
  if(updated===state)return;
  inputLockedUntil=performance.now()+240;
  state=updated;
  music.setPhase(state.phase);
  if(key==='cry')tone(650,.35);
  if(key==='listen')tone(370,.2);
  if(key==='signal'){tone(state.signal==='held'?610:260);if(state.signal==='held')setTimeout(()=>tone(740),150);}
  render(state.slideId==='S00_TITLE'?'start':'next',true);
  window.scrollTo({top:0,behavior:'instant'});
}
// Delegation plus slide/token validation prevents stale buttons and repeat input applying twice.
app.addEventListener('click',event=>{
  const button=event.target.closest('button[data-act]');
  if(!button||button.closest('[inert]')||event.detail>1)return;
  act(button.dataset.act,{expectedSlide:state.slideId,guard:true});
});
app.addEventListener('input',event=>{
  const control=event.target;
  if(!control.matches('input[data-volume]'))return;
  const value=Number(control.value)/100;
  if(control.dataset.volume==='bgm')music.setVolume(value);
  else {effectVolume=value;if(effectBus)effectBus.gain.setValueAtTime(muted?0:effectVolume,audio.currentTime);}
  app.querySelector(`#${control.dataset.volume==='bgm'?'bgm':'se'}-level`).textContent=Math.round(value*100)+'%';
});
window.addEventListener('keydown',event=>{
  if(event.key==='Escape'&&state.modal){event.preventDefault();act('close');return;}
  if(state.modal){
    if(event.key==='Tab'){
      const nodes=[...app.querySelectorAll('.modal button,.modal input,.modal a[href]')];
      const edge=event.shiftKey?nodes[0]:nodes[nodes.length-1];
      if(document.activeElement===edge||!nodes.includes(document.activeElement)){event.preventDefault();nodes[event.shiftKey?nodes.length-1:0]?.focus();}
    }
    return;
  }
  if(event.key==='Enter'||event.key===' '){
    if(event.repeat||performance.now()<inputLockedUntil){event.preventDefault();return;}
    if(event.target.closest('button,a'))return;
    const next=app.querySelector('[data-act="next"],[data-act="start"]');
    if(next){event.preventDefault();act(next.dataset.act,{guard:true});}
  }
});
window.addEventListener('crywolf-music-ready',()=>music.refresh());
document.addEventListener('visibilitychange',()=>{music.setSuspended(document.hidden);if(document.hidden)audio?.suspend();});
window.addEventListener('pagehide',()=>{music.setSuspended(true);audio?.suspend();});
window.addEventListener('pageshow',()=>music.setSuspended(document.hidden));
window.addEventListener('pagehide',event=>{if(event.persisted)return;music.dispose();for(const url of musicSources.values())URL.revokeObjectURL(url);});
window.CRYWOLF_TEST={get:()=>JSON.parse(JSON.stringify(state)),click:key=>act(key),model:{initial,advanceSlide,applyNightAction,resolveReport},muted:()=>muted,music:()=>music.get()};
render();
</script>
</body>
</html>
